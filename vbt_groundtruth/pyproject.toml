# vbt_gt — offline camera-only VBT ground-truth pipeline.
# Package scaffold per docs/00_FOUNDATION.md §0.3 (Step 1 of docs/AGENT_RUNBOOK.md).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vbt_gt"
version = "0.1.0"
description = "Offline camera-only VBT ground-truth pipeline: RealSense single-marker trajectory -> rep boundaries, phase labels, per-rep VBT kinematics, calibrated confidence."
readme = "README.md"
requires-python = ">=3.11"
# Runtime stack pinned by FOUNDATION §0.2 — do not substitute silently.
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",       # parquet output (M5)
    "matplotlib",    # QC plots
    "stumpy",        # matrix profile (M3)
    "scikit-learn",  # confidence calibration only (M4)
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
